variant:
  source: item
  parameters:
    - name: ItemType
      values:
        - base:weapon
name: item
parameters:
  - name: AimingMod
    description: |-
      This parameter looks unusued.
    default: 1.0
    type:
      main: float
    needs:
      - name: ItemType
        values:
          - base:weapon
    isUseless: true
  - name: AimingPerkCritModifier
    description: |-
      This parameter modifies the [critical chance](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-criticalchance) for the [aiming skill](https://pzwiki.net/wiki/Aiming):
      ```
      CriticalChance += AimingPerkCritModifier * Aiming level
      ```
    type:
      main: integer
    needs:
      - name: ItemType
        values:
          - base:weapon
    seeAlso:
      - CriticalChance
      - AimingPerkHitChanceModifier
      - AimingPerkMinAngleModifier
  - name: AimingPerkHitChanceModifier
    description: |-
      This parameter modifies the [hit chance](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-hitchance) for the [aiming skill](https://pzwiki.net/wiki/Aiming):
      ```
      HitChance += AimingPerkHitChanceModifier * Aiming level
      ```
    type:
      main: float
    needs:
      - name: ItemType
        values:
          - base:weapon
    seeAlso:
      - HitChance
      - AimingPerkCritModifier
      - AimingPerkMinAngleModifier
  - name: AimingPerkMinAngleModifier
    description: |-
      This parameter modifies the [minimum angle](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-minangle) for the [aiming skill](https://pzwiki.net/wiki/Aiming). It impacts the minimum angle with the following formula:
      ```java
      effectiveMinAngle = MinAngle - AimingPerkMinAngleModifier * Aiming level
      ```
    type:
      main: float
    needs:
      - name: ItemType
        values:
          - base:weapon
    seeAlso:
      - MinAngle
      - AimingPerkCritModifier
      - AimingPerkHitChanceModifier
  - name: AimingPerkRangeModifier
    "#desc": item/MaxRange
    type:
      main: float
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: Aimingtime
    description: |-
      [Aimingtime](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-aimingtime) is a stat which is directly applied to a [HandWeapon](https://demiurgequantified.github.io/ProjectZomboidJavaDocs/zombie/inventory/types/HandWeapon.html) while [AimingTimeModifier](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-aimingtimemodifier) is applied to [weapon parts](https://demiurgequantified.github.io/ProjectZomboidJavaDocs/zombie/inventory/types/WeaponPart.html). The attachments directly add their [AimingTimeModifier](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-aimingtimemodifier) to the aiming delay.

      It controls the aim-settling delay, the aiming delay counter that must tick down to 0 before the weapon is "settled". Lower values means faster target reacquisition after each shots. The primary "how snappy does this gun feel" lever for semi-automatic guns. It tick down the aiming via the following formula:
      ```java
      rate = 0.625 x gameSpeed x (1 + 0.05 x AimingLevel + (Marksman ? 0.1 : 0))
      ```

      The [marksman](https://pzwiki.net/wiki/Marksman) trait being no longer accessible in the recent versions of the game, the condition involving it will never be reached.

      > Note:
      > This formula might not be fully accurate as [time deltas](https://github.com/demiurgeQuantified/PZModdingGuides/blob/main/guides/GameTime.md) don't appear in the formula.

      While `aimingDelay > 0`, both [hit chance](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-hitchance) and [critical chance](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-criticalchance) take an aim-delay penalty proportional to the remaining delay. The countdown only starts after `recoilDelay` has recovered, so high [RecoilDelay](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-recoildelay) directly delays when `AimingTime` begins ticking.

      On each shots or equip, the aiming delay will be increased or reduced, being impacted by aiming while in a [vehicle](https://pzwiki.net/wiki/Vehicle), being reduced by the trait [Dextrous](https://pzwiki.net/wiki/Dextrous) or increased by [All Thumbs](https://pzwiki.net/wiki/All_Thumbs). The following formula is used:
      ```java
      aimingDelay = AimingTime
              * (Dextrous ? 0.8 : AllThumbs ? 1.2 : 1.0)
              * (in vehicle ? 1.5 : 1.0)
      ```
    type:
      main: integer
    needs:
      - name: ItemType
        values:
          - base:weapon
    seeAlso:
      - AimingTimeModifier
      - RecoilDelay
      - HitChance
      - CriticalChance
  - name: AmmoBox
    description: |-
      Used to indicate the type of ammo box associated to the weapon. This is mostly used to spawn this type of ammo box alongside the gun.
    type:
      main: block
      block:
        name: item
        fullType: true
    needs:
      - name: ItemType
        values:
          - base:weapon
      - name: IsAimedFirearm
        values:
          - true
    seeAlso:
      - AmmoType
      - MaxAmmo
  - name: ClickSound
    default: Stormy9mmClick
    type:
      main: block
      block:
        name: sound
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: ClipSize
    type:
      main: integer
    needs:
      - name: ItemType
        values:
          - base:weapon
    isUseless: true
  - name: CriticalChance
    description: |-
      [CriticalChance](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-criticalchance) sets the base critical hit chance of the weapon. The final `CriticalChance` value after all applied bonuses and penalties have been applied is compared on a 0-100 roll.

      Below is a table listing the different elements which can influence the critical hit chance of a weapon:

      | Element | Type | Description | Formula |
      |---|---|---|---|
      | [AimingPerkCritModifier](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-aimingperkcritmodifier) and [aiming skill](https://pzwiki.net/wiki/Aiming) of the character | Weapon parameter | The aiming level of the character impacts the player's critical hit chance by adding the following to the `CriticalChance` value. | `CriticalChance += AimingPerkCritModifier * Aiming level` |
      | Sight bonus / penalty | Weapon parameter | In the formula, `sightWindowBonus` refers to the bonus from [MinSightRange](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-minsightrange) and [MaxSightRange](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-maxsightrange). `sightlessBonus` on the other hand is a simpler parameter which uses a distance falloff when there is not active sight. The best path is used for the better result. The aim delay penalty depends on [Aimingtime](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-aimingtime) | `CriticalChance += max(sightlessBonus - sightlessAimDelayPenalty, sightWindowBonus - sightWindowAimDelayPenalty)` |
      | Moodles penalty | Player condition | Being panicked, stressed, tired, drunk or lacking endurance will all negatively impact the `CriticalChance`. | `CriticalChance -= moodlesPenalty` |
      | Weather penalty | Environment | Wind, rain, fog, low-light will all negatively impact the `CriticalChance`. | `CriticalChance -= weatherPenalty` |
      | Movement penalty | Player condition | The shooter speed and the distance will negatively impact the `CriticalChance`. | `CriticalChance -= movementPenalty` |
      | [Marksman trait](https://pzwiki.net/wiki/Marksman) | Player condition | This condition can never be reached as the Marksman trait no longer exists. | `CriticalChance += 10` |

      For PvP targets, the entire formula is bypassed and [StopPower](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-stoppower) is used instead. `StopPower` is never used against non-player targets.
      ```
      CriticalChance = StopPower * ( 1 + Aiming level / 15)
      ```

      `CriticalChance` sets the floor for unskilled players while `AimingPerkCritModifier` rewards more or less the character ability to aim. High modified and low base chance means the weapon is a skill-gated crit machine, making the weapon a sort of "experts" weapon.
    default: 20.0
    type:
      main: float
    needs:
      - name: ItemType
        values:
          - base:weapon
    seeAlso:
      - AimingTime
      - RecoilDelay
      - HitChance
      - MinSightRange
      - MaxSightRange
      - StopPower
  - name: CyclicRateMultiplier
    description: |-
      Only in `Auto` [fire mode](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-firemode). Drives the full-auto animation cycle rate via the `autoShootSpeed` [animation variable](https://pzwiki.net/wiki/Conditions).

      A higher value means more shots per second. In `Single` mode this field is ignored and shot speed comes from [RecoilDelay](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-recoildelay) and [Aimingtime](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-aimingtime) instead.

      Increase for SMG feel and decrease for heavy LMG feel.
    default: 1.0
    minimum: 0.0
    type:
      main: float
    needs:
      - name: ItemType
        values:
          - base:weapon
      - name: IsAimedFirearm
        values:
          - true
  - name: DamageCategory
    description: |-
      Defines the type of damage this weapon deals. This is used by the game to apply visual damage to zombies when hit. By default, only one type is available: `Slash`, which will apply slashing visual damage to zombies. These are also impacted by critical hits, providing different results.

      This is Lua sided in the `DamageModelDefinitions` class so you can easily add custom damage categories and visuals. Here is how the game does it:
      ```lua
      DamageModelDefinitions.addDefinition = function(texture, bodyPart, damageCategories, criticalHit)
        local damage = {};
        damage.texture = texture;
        damage.bodyPart = bodyPart;
        damage.damageCategories = damageCategories;
        damage.criticalHit = criticalHit;
        table.insert(DamageModelDefinitions.list, damage);
      end

      -- media/lua/shared/Definitions/DamageModelDefinitions.lua
      DamageModelDefinitions.addDefinition("ZedDmg_BELLY_Slash", BodyPartType.Torso_Lower, {"Slash"});
      DamageModelDefinitions.addDefinition("ZedDmg_BELLY_Skin", BodyPartType.Torso_Lower, {"Slash"}, true);

      DamageModelDefinitions.addDefinition("ZedDmg_CHEST_Slash", BodyPartType.Torso_Upper, {"Slash"});
      DamageModelDefinitions.addDefinition("ZedDmg_BELLY_Skin", BodyPartType.Torso_Upper, {"Slash"}, true);

      DamageModelDefinitions.addDefinition("ZedDmg_HEAD_Slash", BodyPartType.Head, {"Slash"});
      DamageModelDefinitions.addDefinition("ZedDmg_HEAD_Skin", BodyPartType.Head, {"Slash"}, true);
      ```

      This means you could easily add your own type thanks to the `DamageModelDefinitions.addDefinition` function. The `texture` parameter (i.e. `ZedDmg_BELLY_Slash`) refers to a [clothingItem XML file](https://pz-wiki-modding.github.io/PZ-API-Docs/xml/clothingitem.html) that defines the clothing information of the texture.

      ```xml
      <!-- clothing/clothingItems/ZedDmg_BELLY_Skin.xml -->
      <?xml version="1.0" encoding="utf-8"?>
      <clothingItem>
        <m_MaleModel></m_MaleModel>
        <m_FemaleModel></m_FemaleModel>
        <m_GUID>0d1e3942-0a8d-4309-956c-c59c0d15eab2</m_GUID>
        <m_Static>false</m_Static>
        <m_AllowRandomHue>false</m_AllowRandomHue>
        <m_AllowRandomTint>false</m_AllowRandomTint>
        <m_AttachBone></m_AttachBone>
        <m_BaseTextures>bodydmg\m_zeddmg_ribsleft</m_BaseTextures>
        <m_BaseTextures>bodydmg\m_zeddmg_ribsright</m_BaseTextures>
      </clothingItem>
      ```
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: DamageMakeHole
    description: |-
      Whenever this weapon will add holes in a zombie's clothing upon hitting them. This is generally set to true for slashing and piercing weapons, but not blunt weapons.
    type:
      main: boolean
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: EnduranceMod
    "#desc": item/UseEndurance
    default: 1.0
    type:
      main: float
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: ExplosionDuration
    "#desc": item/ExplosionRange
    type:
      main: integer
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: ExplosionPower
    "#desc": item/ExplosionRange
    type:
      main: integer
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: ExplosionRange
    description: |-
      [FireStartingChance](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-firestartingchance) out of 100 is a chance of the explosion to set on fire tiles and burn characters in the [ExplosionRange](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-explosionrange). A value above 100 means the explosion will always set on fire tiles and burn characters, while a value of 0 means it will never set on fire tiles nor burn characters. Each tiles in the explosion range will run the [FireStartingChance](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-firestartingchance) check independently, so a value of 50 means that on average half of the tiles in the explosion range will be set on fire.

      If [ExplosionPower](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-explosionpower) is set above 0, the explosion will burn tiles and set fire to them based on the provided [fireStartingChance](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-firestartingchance).

      [extraDamage](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-extradamage) is used to add a net bonus damage dealt by the trap.

      The damage the trap deals is calculated as follows:
      ```
      damage = random(explosionPower/20, explosionPower/20 * 2) + extraDamage
      ```

      [SmokeRange](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-smokerange) sets the range of the smoke effect. Squares in this range also can be set on fire individually based on [FireStartingChance](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-firestartingchance).

      [FireRange](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-firerange) will set every tiles in the provided range on fire.

      [FireStartingEnergy](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-firestartingenergy) is an extra check added on top of all of these whenever a fire is attempted to be started. Will set the energy of the fire which impacts how strong is is. A value of 0 means no fire is started. Vegetation tiles provide a net bonus of 50 in energy to the fire being created. The created fire will have a life expectency between 300 and 600 (unclear on the units).

      [ExplosionSound](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-explosionsound) can be used to set the sound played when the explosion happens, while [ExplosionDuration](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-explosionduration) can be used to set the duration of the explosion effect, which is especially useful for smoke bombs.
    type:
      main: integer
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: extraDamage
    "#desc": item/ExplosionRange
    type:
      main: float
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: FireMode
    description: |-
      [FireModePossibilities](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-firemodepossibilities) lists the available fire modes of the weapon, and the player can automatically switch between them with the relevant keybind. [FireMode](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-firemode) sets the default fire mode of the weapon, which is the one it will spawn with.

      The vanilla fire modes are:
      - `Single`
      - `Auto`

      Other values are not supported by the game and will be considered as `Single`.
    type:
      main: string
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: FireModePossibilities
    "#desc": item/FireMode
    type:
      main: array
      array:
        separator: /
        type: string
    needs:
      - name: ItemType
        values:
          - base:weapon
      - name: FireMode
  - name: FireRange
    "#desc": item/ExplosionRange
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: FireStartingChance
    "#desc": item/ExplosionRange
    type:
      main: integer
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: FireStartingEnergy
    type:
      main: integer
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: HitChance
    description: |-
      [HitChance](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-hitchance) is a stat which is directly applied to a [HandWeapon](https://demiurgequantified.github.io/ProjectZomboidJavaDocs/zombie/inventory/types/HandWeapon.html) while [HitChanceModified](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-hitchancemodifier) is applied to [weapon parts](https://demiurgequantified.github.io/ProjectZomboidJavaDocs/zombie/inventory/types/WeaponPart.html).

      The initial hitchance is determined by the following configuration:
      ```
      HitChance = min(HitChance, CombatConfigKey.MAXIMUM_START_TO_HIT_CHANCE)
      ```

      [MAXIMUM_START_TO_HIT_CHANCE](https://demiurgequantified.github.io/ProjectZomboidJavaDocs/zombie/combat/CombatConfigKey.html#MAXIMUM_START_TO_HIT_CHANCE) is a configuration of the combat system of Project Zomboid. In this case, the default value is `95.0`, which means the initial HitChance cannot be above `95.0`.

      Below is a table listing the different elements which can influence the hit chance of a weapon:

      | Element | Type | Description | Formula |
      |---|---|---|---|
      | [AimingPerkHitChanceModifier](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-aimingperkhitchancemodifier) and [aiming skill](https://pzwiki.net/wiki/Aiming) of the character | Weapon parameter | The aiming level of the character impacts the player's hit chance. | `HitChance += AimingPerkHitChanceModifier * Aiming level` |
      | Sight bonus / penalty | Weapon parameter | In the formula, `sightWindowBonus` refers to the bonus from [MinSightRange](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-minsightrange) and [MaxSightRange](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-maxsightrange). `sightlessBonus` on the other hand is a simpler parameter which uses a distance falloff when there is not active sight. The best path is used for the better result. | `HitChance += max(sightlessBonus - sightlessAimDelayPenalty, sightWindowBonus - sightWindowAimDelayPenalty)` |
      | Moodles penalty | Player condition | Being panicked, stressed, tired, drunk or lacking endurance will all negatively impact the `HitChance`. | `HitChance -= moodlesPenalty` |
      | Weather penalty | Environment | Wind, rain, fog, low-light will all negatively impact the `HitChance`. | `HitChance -= weatherPenalty` |
      | Movement penalty | Player condition | The shooter speed and the distance will negatively impact the `HitChance`. | `HitChance -= movementPenalty` |
      | Arm pain penalty | Player condition | The character's level of [pain](https://pzwiki.net/wiki/Pain) will impact its aiming. | `HitChance -= armPainPenalty` |
      | Headgear vision penalty | Player condition | Headgear will impact aiming, if the relevant sandbox option is enabled. | `HitChance -= headgearVisionPenalty` |

      The final obtained value of `HitChance` is clamped against the [MINIMUM_TO_HIT_CHANCE](https://demiurgequantified.github.io/ProjectZomboidJavaDocs/zombie/combat/CombatConfigKey.html#MINIMUM_TO_HIT_CHANCE) and [MAXIMUM_TO_HIT_CHANCE](https://demiurgequantified.github.io/ProjectZomboidJavaDocs/zombie/combat/CombatConfigKey.html#MAXIMUM_TO_HIT_CHANCE), both respectively equal to `5.0` and `100.0` by default.

      At point-blank range, all combined penalties are scaled toward zero, so close shots are always more forgiving. The [HitChance](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-hitchance) parameter will set the floor for all players while [AimingPerkHitChanceModifier](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-aimingperkhitchancemodifier) will increase accuracy with the level of aiming of the player. Low base and high modifier makes the gun terrible while unskilled but excellent with investment in aiming.
    type:
      main: integer
    needs:
      - name: ItemType
        values:
          - base:weapon
    seeAlso:
      - AimingPerkHitChanceModifier
  - name: HitFloorSound
    description: |-
      Defines the sound that plays when hitting the floor with the weapon.
    default: BatOnFloor
    type:
      main: block
      block:
        name: sound
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: HitSound
    description: |-
      Defines the sound that plays when hitting a zombie with the weapon. To have no sound play, set the value to `null`.
    default: BaseballBatHit
    type:
      main: block
      block:
        name: sound
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: IdleAnim
    description: |-
      This parameter looks unused.
    default: Idle
    type:
      main: string
    needs:
      - name: ItemType
        values:
          - base:weapon
    isUseless: true
    seeAlso:
      - RunAnim
  - name: IsAimedFirearm
    description: |-
      [IsAimedFirearm](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-isaimedfirearm) enables the entire aimed-firearm subsystem: ballistics controller, reticle, muzzle flash, firearm-specific condition handling and ballistics-base target detection. Without it the weapon falls back to melee sweep logic.

      Set to `true` for any normal gun. Distinct from [Ranged](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-ranged) which marks the item as a ranged weapon for the animations [conditions](https://pzwiki.net/wiki/Conditions).
    type:
      main: boolean
    needs:
      - name: ItemType
        values:
          - base:weapon
      - name: MaxAmmo
  - name: IsAimedHandWeapon
    type:
      main: boolean
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: JamGunChance
    description: |-
      Base probability of a jam on each trigger pull. Final jam roml also scales with the sandbox jam multiplier, current gun condition (lower condition = higher jam chance), and low Aiming/Strength.

      `JamGunChance = 1` is already low. Setting it to `0` basically disables jams from this weapon. Higher values makes the gun unreliable and punishes neglecting the gun or unskilled use.
    default: 1.0
    type:
      main: float
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: MagazineType
    description: |-
      Used to set the magazine item the gun uses. If not provided, then the gun doesn't use a magazine item and loads rounds individually. [MaxAmmo](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-maxammo) is used to set the capacity of either the magazine item or the gun.
    type:
      main: block
      block:
        name: item
        fullType: true
    needs:
      - name: ItemType
        values:
          - base:weapon
      - name: IsAimedFirearm
        values:
          - true
    seeAlso:
      - AmmoType
      - MaxAmmo
      - AmmoBox
      - WeaponReloadType
  - name: MaxHitcount
    description: |-
      [MaxHitcount](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-maxhitcount) sets the maximum number of targets the weapon can hit with one attack. For ranged weapons, it will determine how many targets a single shot can hit. For melee weapons, a single swing can hit multiple targets if the relevant sandbox option allows it (Weapon Multi-Hit).

      When [PiercingBullets](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-piercingbullets) is `true`, a shot continues past the first target and registers on collinear targets behind it. Each subsequent pierced target receives reduced damage (`damage / PIERCING_BULLET_DAMAGE_REDUCTION`). Targets must be within approximatively 1 degree of each other in angle to qualify.

      Keep `MaxHitcount` to 1 for a standard rifle, and set it to 2 with [PiercingBullets](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-piercingbullets) to have AP rounds behavior (M16A2 for example).
    default: 1000
    type:
      main: integer
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: MaxSightRange
    description: |-
      [MinSightRange](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-minsightrange) and [MaxSightRange](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-maxsightrange) define the optimal sight window, to be more specific, the distance band where hits and critical hits bonuses peak.

      The [aiming skill](https://pzwiki.net/wiki/Aiming) and [eagle eyed](https://pzwiki.net/wiki/Eagle_Eyed) will impact these values:
      ```
      effectiveMin = MinSightRange x (1 - AimingLevel / 30)
      effectiveMax = MaxSightRange x (1 + AimingLevel / 30) x (EagleEyed ? 1.2 : 1.0)
      ```

      At aiming 10, the minimum shrinks by 33% and the max grows by 33%, which widens the window significantly. When the trait [Short Sighted](https://pzwiki.net/wiki/Short_Sighted) is present and the character doesn't wear glasses, the `effectiveMax` equals `effectiveMin`, making the entire bonus window disappear.

      Inside the the `effectiveMin` and `effectiveMax` window, the bonus follows a [Gaussian](https://en.wikipedia.org/wiki/Bell-shaped_function) with the bonus peaking at the midpoint. Aim-delay penalty is also reduced inside the window.

      Below `effectiveMin`, a small linear penalty is applied as the gun is not suited for point-blank. Above `effectiveMax`, a growing quadratic penalty is applied, the bonus degrades rapidly past the edge.

      A CQC gun should have a low [MaxSightRange](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-maxsightrange) while a marksman riffle should have a high [MinSightRange](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-minsightrange) with a wide window.
    type:
      main: float
    needs:
      - name: ItemType
        values:
          - base:weapon
          - base:weaponpart
  - name: MinAngle
    description: |-
      For [IsAimedFirearm](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-isaimedfirearm) set to `true`, the ballistics controller handles target detection and does not use [MinAngle](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-minangle) in the ranged hit-chance formula. These serve one narrow purpose: the `isMeleeTargetTooCloseToShoot()` check, detecting if a target is so close it should trigger a melee strike instead of a shot.

      `MinAngle` is a dot-product threshold (-1 to 1). Values near 1.0 mean the target must be almost directly in front to trigger the melee-swap check, while lower values widen the angle.

      [AimingPerkMinAngleModifier](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-aimingperkminanglemodifier) is parsed and stored and impacts the minimum angle with the following formula:
      ```java
      effectiveMinAngle = MinAngle - AimingPerkMinAngleModifier * Aiming level
      ```
    default: 1.0
    type:
      main: float
    needs:
      - name: ItemType
        values:
          - base:weapon
    seeAlso:
      - AimingPerkMinAngleModifier
  - name: MinSightRange
    "#desc": item/MaxSightRange
    type:
      main: float
    needs:
      - name: ItemType
        values:
          - base:weapon
          - base:weaponpart
  - name: PhysicsObject
    description: |-
      Provides another item (or itself) as a throwable object. When used, the item will be thrown instead of used as an actual in hands weapon.
    type:
      main: block
      block:
        name: item
        fullType: true
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: PiercingBullets
    "#desc": item/MaxHitcount
    type:
      main: boolean
    needs:
      - name: ItemType
        values:
          - base:weapon
      - name: IsAimedFirearm
        values:
          - true
      - name: MaxHitcount
        minimum: 2
  - name: Projectilecount
    description: |-
      Only active when the weapon is ranged and has [RangeFalloff](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-rangefalloff) set to `true`. In that mode, the ballistics controller generates multiple spread projectiles. The field is never read when [RangeFalloff](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-rangefalloff) is `false`.

      Inert for standard rifles. Required only for shotgun-style spread.
    default: 1
    type:
      main: integer
    needs:
      - name: ItemType
        values:
          - base:weapon
      - name: IsAimedFirearm
        values:
          - true
  - name: ProjectileSpread
    description: |-
      Projectile spread seems to be mostly a visual effect and doesn't affect the actual hit chance of the weapon. The spread will be calculated following a formula close to the following:
      ```
      spread = ProjectileSpread * 10 degrees +/- 2 degrees
      ```

      With the `spread` value being the total cone angle of the projectiles.
    type:
      main: float
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: PushBackMod
    description: |-
      Scales the magnitude of the hit-reaction push applied to the target character. A higher value will increase the time the target is staggered. It will also impact the spread of blood.

      Higher gives a more weighty, impactful feel.
    default: 1.0
    type:
      main: float
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: Ranged
    "#desc": item/IsAimedFirearm
    type:
      main: boolean
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: RangeFalloff
    type:
      main: boolean
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: RecoilDelay
    description: |-
      [RecoilDelay](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-recoildelay) is a stat which is directly applied to a [HandWeapon](https://demiurgequantified.github.io/ProjectZomboidJavaDocs/zombie/inventory/types/HandWeapon.html) while [AimingTimeModifier](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-recoildelaymodifier) is applied to [weapon parts](https://demiurgequantified.github.io/ProjectZomboidJavaDocs/zombie/inventory/types/WeaponPart.html). Weapon attachments will add or subtract from [RecoilDelay](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-recoildelay) directly.

      Controls how long post-shot recovery takes before aim settling can begin. High values means the gun has a huge kick and forces a pause. Lower values is a flat, fast and snappy gun. [Strength](https://pzwiki.net/wiki/Strength) and [aiming](https://pzwiki.net/wiki/Aiming) will both reduce the recoil delay. Holding the gun one-handed will negatively impact the recoil handling. The following formula is used:
      ```java
      effectiveDelay = RecoilDelay
                    * (1 - AimingLevel / 40)
                    * (1 - (StrengthLevel * 2 - 10) / 40)
                    * (one-handed penalty: * 1.3 if primary hand only, secondary empty)
      ```

      Aim countdown starts when the recoil delay counter is less than `effectiveDelay * AimingLevel / 30`. Higher aiming also lets aim recovery start earlier in the recoil window.
    needs:
      - name: ItemType
        values:
          - base:weapon
    seeAlso:
      - RecoilDelayModifier
      - AimingTime
      - HitChance
  - name: RunAnim
    description: |-
      This parameter looks unused.
    default: Run
    type:
      main: string
    needs:
      - name: ItemType
        values:
          - base:weapon
    isUseless: true
    seeAlso:
      - IdleAnim
  - name: ShellFallSound
    type:
      main: block
      block:
        name: sound
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: StopPower
    "#desc": item/CriticalChance
    default: 5.0
    type:
      main: float
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: SwingSound
    default: BaseballBatSwing
    type:
      main: block
      block:
        name: sound
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: TwoHandWeapon
    description: |-
      [TwoHandWeapon](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-twohandweapon) marks the weapon as a two-handed weapon. [RecoilDelay](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-recoildelay) gets a x1.3 penalty when the weapon is held one-handed instead of two handed. [RequiresEquippedBothHands](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-requiresequippedbothhands) enforces the equip restriction in the context menu.
    type:
      main: boolean
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: UseEndurance
    description: |-
      If `true`, the weapon will consume stamina on use based on the weapon [weight](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-weight), [EnduranceMod](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-endurancemod), fatigue modifiers and traits.

      For guns, it is preferable to keep this as `False`.
    default: true
    type:
      main: boolean
    needs:
      - name: ItemType
        values:
          - base:weapon
  - name: WeaponReloadType
    description: |-
      Used to select the reload workflow of the gun. Notably affects rack-after-shot, insertion style and animations. The provided value references the [variable condition](https://pz-wiki-modding.github.io/PZ-API-Docs/xml/animnode.html#m-conditions) `WeaponReloadType` in [AnimNodes](https://pzwiki.net/wiki/AnimNodes). The game has the following values available by default:
      - `handgun`
      - `shotgun`
      - `boltactionnomag`
      - `boltaction`
      - `revolver`
      - `doublebarrelshotgun`
      - `doublebarrelshotgunsawn`

      A custom `WeaponReloadType` cannot be defined due to them being hardcoded in the game's Java via an [enum](https://albion.codeberg.page/PZ-JavaDocs/zombie/scripting/objects/WeaponReloadType.html). You can read more about it [here](https://discord.com/channels/136501320340209664/1476602902607954043/1492110660858024026).
    default: handgun
    type:
      main: string
    needs:
      - name: ItemType
        values:
          - base:weapon
      - name: IsAimedFirearm
        values:
          - true
    seeAlso:
      - AmmoType
      - MagazineType
