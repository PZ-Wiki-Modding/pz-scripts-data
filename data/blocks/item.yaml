- name: IsCookable
  description: |-
    [IsCookable](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-iscookable) marks as the item as cookable.

    [MinutesToCook](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-minutestocook) controls how many in-game minutes it takes for the food to be fully cooked. 
    
    [MinutesToBurn](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-minutestoburn) controls how many in-game minutes it takes for the food to burn. This value must be higher than [MinutesToCook](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-minutestocook) or your item will be instantly burnt before being fully cooked.

    [RemoveNegativeEffectOnCooked](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-removenegativeeffectoncooked) will remove any negative changes in thirst, unhappiness and boredom when the food is cooked.

    [BadInMicrowave](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-badinmicrowave) will set the unhappiness and boredom changes to `5.0` when cooked in a microwave.
