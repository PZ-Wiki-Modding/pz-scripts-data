- name: CritDmgMultiplier
  default: 2.0
  type:
    main: float
  description: |-
    Multiplier applied to the damage of a hit if it is a critical hit, applied inside [IsoGameCharacter.Hit()](https://demiurgequantified.github.io/ProjectZomboidJavaDocs/zombie/characters/IsoGameCharacter.html#Hit(zombie.inventory.types.HandWeapon,zombie.characters.IsoGameCharacter,float,boolean,float,boolean)). Two types of crits can trigger:
    - A normal crit: `damage *= max(2.0, CritDmgMultiplier)`
    - Aim-at-floor stomp (melee only): `damage *= max(5.0, CritDmgMultiplier)`

    The default value of the `HandWeapon` class is `2.0`. Values of `3.0` to `5.0` visibly spike crit damage while values above `5.0` also start boosting stomps.
  itemTypes:
  - weapon
- name: CustomContextMenu
  description: |-
    Defines the context menu option name when eating or drinking an item. The value will be used to look up the corresponding translation key in the [ContextMenu](https://pz-wiki-modding.github.io/PZ-API-Docs/translations/translation_files.html#contextmenu) translation file using the prefix `ContextMenu_`. For example, if the value is `Gobble`, the translation key `ContextMenu_Gobble` will be used.
    
    By default, if the item is a `base:food` ItemType or has a [OpeningRecipe](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-openingrecipe), the context menu option will be `ContextMenu_Eat`. If the item has a [fluid container](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/component/component-fluidcontainer.html) component, the option will be `ContextMenu_Drink`.

    The game uses the following values:
    - `Eat`
    - `Drink`
    - `Smoke`
    - `Sniff`
    - `Chew`
    - `Take`
  type:
    main: translation
    translation:
      keyPattern: ContextMenu_{value}
      sourceFile: ContextMenu
