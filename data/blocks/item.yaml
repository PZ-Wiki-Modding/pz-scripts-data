    [PoisonPower](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-poisonpower) defines the strength of the poison, where a positive value will make the food poisonous.

    [PoisonDetectionLevel](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-poisondetectionlevel) doesn't seem to be useful, where a positive value will make it pass all the checks anyway, so increasing that value doesn't do anything.]

    You can also mark an item to be shown as poisonous to the player by adding the [ItemTag](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-itemtag) `base:showpoison`.

    The parameters [Poison](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-poison) and [UseForPoison](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-useforpoison) look unused.
