- name: Sharpness
  description: |-
    The sharpness of the item which needs to be a value between 0.0 and 1.0. By default however, it should be set to 1.0 which represents maximum sharpness. If you set it to a lower value, it means the item will never spawn with 100% sharpness.

    This parameter is handled as an [attribute](https://albion.codeberg.page/PZ-JavaDocs/zombie/entity/components/attributes/Attribute.html#Sharpness) of the item.

    The sharpness value is used for a sharpness multipler that is applied to the weapon maximum damage, door damage and tree damage. Its value decreases when using the item.

    It is calculated the following way:
    ```java
    sharpness = sharpness attribute ? (sharpness + 1.0) / 2.0 : 1.0
    ```

    This means that if the item has no sharpness attribute, it will be considered to have a sharpness multipler of 1.0, but if the sharpness attribute is present, then the multiplier varies from 0.5 (sharpness=0.0) to 1.0 (sharpness=1.0).

    The weapon's maximum damage varies between the minimum and maximum damage values based on the current sharpness multiplier:
    ```java
    maxDamage = sharpness attribute 
                ? (maxDamage - minDamage) * sharpnessMultiplier + minDamage 
                : maxDamage
    ```

    Door and tree damage vary the same way with the sharpness multiplier:
    ```java
    finalDamage = damage * sharpnessMultiplier
    ```

    The critical damage multiplier is also impacted by the sharpness multiplier:
    ```java
    finalCriticalDamage = sharpness attribute 
                          ? criticalDamage * sharpnessMultiplier 
                          : criticalDamage
    ```

    This critical damage multiplier is applied to the damage value that the player receives, with a maximum value of 5.0.

    The maximum sharpness value of the item is also impacted by the [head condition](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-headcondition) of the item, if present:
    ```java
    maxSharpness = head condition attribute
                   ? headCondition / maxHeadCondition
                   : condition / maxCondition
    ```

    Sharppening the item has a chance to lower the item's [condition](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-conditionlowerchanceonein).
  type:
    main: float
  seeAlso:
    - HeadCondition
