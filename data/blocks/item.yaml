- name: WaterResistance
  description: |-
    [WaterResistance](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-waterresistance) is used to define how much the clothing item will resist water. The higher the value, the more resistant the clothing item will be to water. A value of `1.0` means the clothing item is fully waterproof, while a value of `0.0` means it is not waterproof at all.

    This is the exact same process for [WindResistance](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-windresistance) but for wind instead of water.
  type:
    main: float
