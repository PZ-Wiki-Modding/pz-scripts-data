  description: Whether the weapon has a chamber that can hold a round in addition
    to its magazine.
- name: HeadCondition
  description: |-
    The head condition of the item, which needs to be a value between 0 and 1000 (which is an extremely high limit). The following values are commonly used by the game are more around ~10:
    - 3: spear with glass shard (the head is the glass shard, so breaks easily)
    - 4: crude spear
    - 5: long crude spear, jawbone bovide club
    - 6: spear with hand fork
    - 8: stone hammer
    - 10: scythe, club hammer, forged hammer, hatchet, garden hoe
    - 13: axes, pickaxes
    - 15: stone axe, wood axe (higher because looks more durable ?)
    - 20: stone mace
    - 30: maces

    This parameter is handled as an [attribute](https://albion.codeberg.page/PZ-JavaDocs/zombie/entity/components/attributes/Attribute.html#HeadCondition) of the item.

    The chance for the head condition to be lowered is impacted by [HeadConditionLowerChanceMultiplier](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-headconditionlowerchancemultiplier), the [maintenance](https://pzwiki.net/wiki/Maintenance) level of the player as well as the level of the player in the skill used to achieve the action (combat, crafting, etc.). The general [condition lowering chance](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-conditionlowerchanceonein) of the item will also impact the head condition lowering chance. Lots of steps are involved for the final chance so it isn't detailed here.

    If the head condition reaches zero, the item itself will break. The head condition will also impact the max [sharpness](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-sharpness) of the item.
  type:
    main: integer
  seeAlso:
    - Sharpness
    - HeadConditionMax
    - HeadConditionLowerChanceMultiplier
    - ConditionLowerChanceOneIn
- name: HeadConditionLowerChanceMultiplier
  description: |-
    A multiplier used to determine the chance of the head condition being lowered when the item is used.
  type:
    main: float
  default: 1.0
  seeAlso:
    - HeadCondition
    - HeadConditionMax
- name: HeadConditionMax
  description: |-
    The maximum value for the [head condition](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-headcondition) of the item, between 0 and 1000. If the head condition goes over this value, it will be capped at this maximum.

    If not provided but HeadCondition is set, the [max condition](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-conditionmax) of the item is used instead.
  seeAlso:
    - HeadCondition
    - HeadConditionLowerChanceMultiplier
    - ConditionMax
