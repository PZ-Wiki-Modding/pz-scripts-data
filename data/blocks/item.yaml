- name: EatType
  description: |-
    Used mostly on the Lua side and in [AnimNodes](https://pzwiki.net/wiki/AnimNode) as a [condition](https://pz-wiki-modding.github.io/PZ-API-Docs/xml/animNode.html#m-conditions) to mark what animation to use when eating this item. Based on the type of item, this is directly applied to the `FoodType` animation condition.
    
    Here's a small summary of some special conditions:
    - `Pot` and `PotForged` are applied directly, and will force the item to be held in the right hand and removing other items from the left hand, meant for a pot held with two hands.
    - `popcan` forces drinking [timed action](https://pzwiki.net/wiki/Timed_Action_(Lua)) `maxTime` to a flat `160`.
    - `Candrink` will make the player uses an item with the  spoon or [fork](https://pzwiki.net/wiki/Fork#Eating) tag in their inventory. A "scraping" sound will also be played when using an utensil and 70% of the eating action is passed.
    - `Plate` can also use a fork or spoon.
    - `2handbowl` will use only spoons in the player inventory.

    There also exists more generic ones:
    - `2hand`
    - `plate` (different than `Plate`)
    - `EatSmall`
    - `EatBox`

    You can use any custom value which will be passed to the `FoodType` condition.
  type:
    main: string
