    Sets the food type of the item. A translation entry needs to be made for custom types which has the key `ContextMenu_FoodType_<type>`.

    To be a valid food item to feed to animals, the item needs to be of type `Fruits` or `Vegetables`.
  type:
    main: string
  # no needs bcs the field can actually be accessed in Item via a global method getItemFoodType
- name: GoodHot
  description: |-
    [GoodHot](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-goodhot) reduces by a flat 2 the happiness change when eating this food hot. On the other hand, [BadCold](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-badcold) increases by a flat 2 the unhappiness change when eating this food cold.
  itemTypes:
