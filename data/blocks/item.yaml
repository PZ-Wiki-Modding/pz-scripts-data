- name: IconFluidMask
  description: |-
    Defines a mask that will receive the tint color of the [fluid contained](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/component/component-fluidcontainer.html#scripts-component-fluidcontainer) within the item. This mask is applied over the original [icon](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-icon).

    There is no official support for [IconsForTexture](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-iconsfortexture) with fluid masks but the [Fluid Mask By Index API](https://pzwiki.net/wiki/Fluid_Mask_By_Index_API) can be used to achieve similar functionality.

    Similarly to the [icon](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-icon) parameter, the texture file of the mask must be stored inside the `media/textures` directory with the `Item_` prefix and `png` extension.

    Taking on the example file structure in the [icon](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-icon) parameter description, your masks can be the following:
    ```
    📁 media
      📁 textures
        📄 Item_iconName_Mask.png
        📄 Item_iconNameCooked_Mask.png
        📄 Item_iconNameRotten_MyFluidMask.png
        📄 Item_iconNameBurnt_DifferentNamingMask.png
    ```

    *Note: the `_Mask` suffix is not mandatory (notice it not present in the two last icons) but is simply what the base game uses, so it's probably best to keep that convention.*
  type:
    main: file
    file:
      relativeTo: media/textures
      prefix: Item_
      extension: png
