- name: MaxRange
  description: |-
    [MaxRange](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-maxrange) is a stat which is directly applied to a [HandWeapon](https://demiurgequantified.github.io/ProjectZomboidJavaDocs/zombie/inventory/types/HandWeapon.html) while [MaxRangeModifier](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-maxrangemodifier) is applied to [weapon parts](https://demiurgequantified.github.io/ProjectZomboidJavaDocs/zombie/inventory/types/WeaponPart.html).

    The [MaxRange](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-maxrange) of a weapon is used to determine the maximum distance the weapon can shoot. Targets beyond `effectiveMaxRange` calculated with the formula below simply can't be reached, the parameter is a hard cutoff, not a penalty in damage or anything like that.
    ```
    effectiveMaxRange = MaxRange + AimingPerkRangeModifier x (AimingLevel / 2.0)
    ```

    All rifles from the base game have a `AimingPerkRangeModifier` of 0, so [aiming level](https://pzwiki.net/wiki/Aiming) has no effect on the range of guns. Set it above 0 to give skilled players extra reach.
  itemTypes:
  - weapon
  type:
    main: float
  default: 1.0
