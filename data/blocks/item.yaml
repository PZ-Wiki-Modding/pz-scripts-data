- name: EvolvedRecipe
  description: |-
    [EvolvedRecipe](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-evolvedrecipe) is used to list the [evolved recipes](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/evolvedrecipe.html) this item can be used in as an ingredient. The syntax needs to be as follows:
    ```cpp
    EvolvedRecipe = recipeName1:quantity1;recipeName2:quantity2;recipeName3:quantity3,
    ```

    A custom flag `cooked` can also be added for specific recipes, for example:
    ```cpp
    EvolvedRecipe = recipeName1:quantity1|cooked;recipeName2:quantity2;recipeName3:quantity3,
    ```
    Here the `recipeName1` will require the item to be cooked first before being used in the recipe.

    A simpler syntax is also technically supported where the quantity can be omitted:
    ```cpp
    EvolvedRecipe = recipeName1;recipeName2:quantity2;recipeName3,
    ```

    [EvolvedRecipeName](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-evolvedrecipename) can be used to set the name of the item that will be displayed in the result item. That parameter gets ignored if the game language is not english, and due to a bug it won't even use the translation of the item so it will use the fullType.
  type:
    main: object
    object:
      keyValueSeparator: ":"
      keyType: block
      pairsSeparator: ";"
      valueType: string
      keyBlock:
        name: evolvedrecipe
      softOverride: true
