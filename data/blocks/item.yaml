  description: |-
    Rolls the hit damage of the weapon between `MinDamage` and `MaxDamage`.
    
    [WeaponParts](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-itemtype) can modify the damage of the weapon with the [DamageModifier](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-damagemodifier) parameter. When equipped, a [WeaponPart](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-itemtype) will increase the minimum and maximum damage of the weapon by the provided value. You are not limited to positive values, you can also add damage debuffs to the weapon by providing negative values.
- name: MaxItemSize
