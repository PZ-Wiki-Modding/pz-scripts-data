- name: StaticModelsByIndex
  description: |-
    [StaticModelsByIndex](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-staticmodelsbyindex) and [WorldStaticModelsByIndex](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-worldstaticmodelsbyindex) can be used to define multiple models for the same item definition, which is useful for variants of the same item (e.g. a weapon with different skins). You can use [IconsForTexture](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-iconsfortexture) alongside those to define different [icons](https://pz-wiki-modding.github.io/PZ-API-Docs/scripts/item.html#scripts-item-icon) for each variant. Here's an example usage with three variants of the same item:
    ```cpp
    StaticModelsByIndex = AK47;AK47_Desert;AK47_Woodland,
    WorldStaticModelsByIndex = AK47;AK47_Desert;AK47_Woodland,
    IconsForTexture = AK47;AK47_Desert;AK47_Woodland,
    ```
  seeAlso:
    - StaticModel
    - WorldStaticModel
    - IconsForTexture
