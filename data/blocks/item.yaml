- name: Categories
  description: |-
    Categories are used for **melee** weapons and should not be used for ranged weapons. This is because the game notably sets a flag `isMelee` if there are any provided categories, which means adding categories to a ranged weapon will incorrectly mark it as melee. They are notably used to define the perk associated to the weapon, for XP gain purposes or weapon handling considerations.
    
    Available values are the following, defined by the [WeaponCategory](https://albion.codeberg.page/PZ-JavaDocs/zombie/scripting/objects/WeaponCategory.html) registry (which means you can define custom ones):
    - `base:axe`
    - `base:blunt`
    - `base:spear`
    - `base:improvised`
    - `base:longblade`
    - `base:smallblade`
    - `base:smallblunt`
    - `base:unarmed`
    
    They also provide a damage modifier based on the category of the weapon (spear, axe, blunt):
    ```java
    damageMod = blunt  ? (3 < bluntLevel < 6 ? 1.1 : (bluntLevel > 7 ? 1.2 : 1.0)
              : (axe   ? (3 <  axeLevel  < 6 ? 1.1 : ( axeLevel  > 7 ? 1.2 : 1.0)
              : (spear ? (3 < spearLevel < 6 ? 1.1 : (spearLevel > 7 ? 1.2 : 1.0)
              : 1.0)))))
    ```

    Items with the `base:axe` category will have lower chance of being damaged when hitting a tree. Items with the `base:smallblade` will reduce the time of staggering zombies from back attacks to the minimum.

# UNUSED BY THE GAME CURRENTLY
#    It will also modify the speed modifier applied to the weapon's attack speed for blunt, axe and spear weapons. The skill levels of the mentioned categories apply the following modifiers to the speed modifier:
#
#    | Level | Modifier |
#    | ----- | -------- |
#    | 0     | 1.0      |
#    | 1     | 0.95     |
#    | 2     | 0.9      |
#    | 3     | 0.86     |
#    | 4     | 0.83     |
#    | 5     | 0.8      |
#    | 6     | 0.77     |
#    | 7     | 0.74     |
#    | 8     | 0.71     |
#    | 9     | 0.68     |
#    | 10    | 0.65     |
#
#    The axe man trait also reduces the speed modifier by 95% when using an axe weapon.
  type:
    main: array
    array:
      type: string
      separator: ';'
      softOverride: true
  seeAlso:
    - DisplayCategory
