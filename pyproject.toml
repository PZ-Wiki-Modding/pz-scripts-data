[project]
name = "pz-scripts-data"
description = "Dataset for the Scripts of Project Zomboid."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12.3"
version = "1.3.1"
license = "MIT"
authors = [
    { name = "SimKDT" },
]
dependencies = [
    "pyyaml",
    "jsonschema",
    "pydantic>=2.11",
    "typed-argparse>=0.3.1",
    "deprecated>=3.0.1",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]

[project.scripts]
pz_scripts_data = "pz_scripts_data.release:main"

[tool.uv]
package = true

[tool.setuptools.package-data]
pz_scripts_data = [
    "py.typed"
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
