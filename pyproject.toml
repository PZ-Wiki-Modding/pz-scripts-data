[project]
name = "pz-scripts-data"
description = "Dataset for the Scripts of Project Zomboid."
requires-python = ">=3.12.3"
version = "1.0.3"
license-files = ["LICENSE"]
authors = [
    { name = "SimKDT" },
]
dependencies = [
    "pyyaml",
    "jsonschema",
    "pydantic>=2.11",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]

[project.scripts]
release = "pz_scripts_data.release:main"

[tool.setuptools.package-data]
pz_scripts_data = [
    "py.typed"
]