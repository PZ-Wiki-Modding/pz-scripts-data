name: Format Script Blocks

on:
  schedule:
    - cron: '0 0 * * *' # every day at midnight
  pull_request:
    branches: [main, dev]
    paths:
      - 'data/blocks/**'
      - 'src/formatBlocks.py'
      - 'src/sortItemParameters.py'
      - '.github/workflows/format-blocks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.0
          
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install build dependencies
        run: |
          uv sync

      - name: Run schema validation
        run: |
          make validate_data

      - name: Run output formatting
        run: |
          make format

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add out/scriptsBlocks.json
          git add out/roots.json
          git add out/itemParameters.json
          git add schemas/blocks.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "ci: format output data" && git push)
