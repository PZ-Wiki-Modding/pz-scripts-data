name: Format Script Blocks

on:
  schedule:
    - cron: '0 0 * * *' # every day at midnight
  pull_request:
    branches: [main, dev]
    paths:
      - 'data/blocks/**'
      - 'src/formatBlocks.py'
      - 'src/sortItemParameters.py'
      - '.github/workflows/format-blocks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.0
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
          
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install .

      - name: Run schema validation
        run: |
          make validate

      - name: Run output formatting
        run: |
          make format

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add out/scriptsBlocks.json
          git add out/roots.json
          git add out/itemParameters.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "CHORE: format output data" && git push)