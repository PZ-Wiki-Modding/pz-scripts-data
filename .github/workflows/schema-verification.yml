name: Data validation via schemas

on:
  push:
    branches: [main, dev]
    paths:
      - 'data/blocks/**'
      - 'src/validateBlocks.py'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.0
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
          
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install .

      - name: Run schema validation
        run: |
          make validate
