name: Data validation via schemas

on:
  push:
    branches: [main, dev]
    paths:
      - 'data/blocks/**'
      - 'src/pz_scripts_data/tests/test_data.py'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.0

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install build dependencies
        run: |
          uv sync

      - name: Run schema validation
        run: |
          make validate_data
